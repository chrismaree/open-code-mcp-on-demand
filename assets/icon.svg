<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="mcp-on-demand icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- dormant nodes -->
  <g fill="none" stroke="#475569" stroke-width="5">
    <circle cx="30" cy="34" r="9"/>
    <circle cx="98" cy="34" r="9"/>
    <circle cx="30" cy="94" r="9"/>
  </g>
  <g stroke="#334155" stroke-width="4" stroke-dasharray="4 6" stroke-linecap="round">
    <line x1="38" y1="40" x2="54" y2="56"/>
    <line x1="90" y1="40" x2="74" y2="56"/>
    <line x1="38" y1="88" x2="54" y2="72"/>
  </g>
  <!-- active node -->
  <line x1="74" y1="72" x2="90" y2="88" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
  <circle cx="98" cy="94" r="10" fill="#a78bfa"/>
  <!-- hub with bolt -->
  <circle cx="64" cy="64" r="20" fill="#312e81" stroke="#a78bfa" stroke-width="4"/>
  <path d="M67 50 L56 66 H64 L61 78 L72 62 H64 Z" fill="url(#bolt)"/>
  <!-- sleeping z -->
  <text x="20" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748b">z</text>
  <text x="104" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">z</text>
</svg>
