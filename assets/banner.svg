<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="mcp-on-demand: MCP servers that sleep until your agent needs them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- left: network illustration -->
  <g transform="translate(70 40)">
    <circle cx="120" cy="120" r="110" fill="url(#glow)"/>
    <g stroke="#334155" stroke-width="4" stroke-dasharray="5 8" stroke-linecap="round">
      <line x1="120" y1="120" x2="30" y2="40"/>
      <line x1="120" y1="120" x2="215" y2="35"/>
      <line x1="120" y1="120" x2="20" y2="190"/>
      <line x1="120" y1="120" x2="120" y2="235"/>
    </g>
    <line x1="120" y1="120" x2="225" y2="200" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <g fill="#0f172a" stroke="#475569" stroke-width="4">
      <circle cx="30" cy="40" r="16"/>
      <circle cx="215" cy="35" r="16"/>
      <circle cx="20" cy="190" r="16"/>
      <circle cx="120" cy="235" r="16"/>
    </g>
    <circle cx="225" cy="200" r="18" fill="#a78bfa"/>
    <circle cx="120" cy="120" r="38" fill="#312e81" stroke="#a78bfa" stroke-width="5"/>
    <path d="M126 92 L104 124 H120 L114 148 L136 116 H120 Z" fill="url(#bolt)"/>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" fill="#64748b">
      <text x="44" y="22" font-size="20">z</text>
      <text x="58" y="10" font-size="14">z</text>
      <text x="230" y="16" font-size="18">z</text>
      <text x="0" y="172" font-size="16">z</text>
    </g>
  </g>

  <!-- right: text -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="120" font-size="64" font-weight="800" fill="#f8fafc">mcp-on-demand</text>
    <text x="402" y="166" font-size="23" fill="#c4b5fd">MCP servers for OpenCode that sleep until your agent needs them</text>
    <g font-size="18" fill="#94a3b8">
      <text x="402" y="218">● dormant by default   ● connected on demand   ● idle servers stop</text>
    </g>
    <text x="402" y="270" font-size="18" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">curl -fsSL …/install.sh | sh</text>
  </g>
</svg>
